name: Update and publish

# Every day: run the tests, check the listings in awards/, and publish the site to GitHub
# Pages (so passed deadlines drop off on time). Pull requests only run the checks.
# Turn on once: Settings -> Pages -> Source: GitHub Actions.

on:
  schedule:
    - cron: "17 11 * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh shared disciplines from stemedplus-theme
        run: python -m stemed_awards.stemedplus_disciplines --refresh
      - name: Refresh the shared STEMEd+ look
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/stemedplus/stemedplus-theme.git "$RUNNER_TEMP/stemedplus-theme"
          python "$RUNNER_TEMP/stemedplus-theme/apply.py" .
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
      - name: Check the listings in awards/
        run: python -m stemed_awards --validate

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Refresh shared disciplines from stemedplus-theme
        run: python -m stemed_awards.stemedplus_disciplines --refresh
      - name: Refresh the shared STEMEd+ look
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/stemedplus/stemedplus-theme.git "$RUNNER_TEMP/stemedplus-theme"
          python "$RUNNER_TEMP/stemedplus-theme/apply.py" .
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
      - name: Build the site
        run: >-
          python -m stemed_awards
          --out output
          --previous "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: output

  publish:
    # Publishing is its own job, after the build, as GitHub recommends for Pages. If it ever
    # fails, "Re-run failed jobs" publishes the same build again without uploading it twice.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
